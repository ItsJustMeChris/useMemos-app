name: MemosNative
options:
  bundleIdPrefix: com.chris
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
targets:
  MemosNative:
    type: application
    platform: iOS
    sources:
      - path: MemosNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mcgravey.usememos
        PRODUCT_MODULE_NAME: MemosNative
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Memos
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Memos connects directly to your self-hosted server on your local network.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose photos to attach to your memos.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: MemosNative/Resources/Info.plist
      properties:
        CFBundleDisplayName: Memos
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Memos connects directly to your self-hosted server on your local network.
        NSPhotoLibraryUsageDescription: Choose photos to attach to your memos.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: []
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  MemosNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MemosNativeTests
    dependencies:
      - target: MemosNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mcgravey.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MemosNative:
    build:
      targets:
        MemosNative: all
        MemosNativeTests: [test]
    test:
      targets:
        - MemosNativeTests
